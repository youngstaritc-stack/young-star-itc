name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      run: |
        cd mobile_app
        npm install
        npx cap sync android

    - name: Make Gradlew Executable
      run: chmod +x mobile_app/android/gradlew

    - name: Build APK
      run: |
        cd mobile_app/android
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: mobile_app/android/app/build/outputs/apk/debug/app-debug.apk
